<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой сайт</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
        }

        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 20px;
            background: rgba(15, 23, 42, 0.95);
            text-align: center;
            z-index: 1000;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 20px;
            font-weight: bold;
        }

        nav a:hover {
            color: #38bdf8;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 80px 20px;
            background:
                linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.9)),
                url("https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1600&q=80")
                center/cover;
        }

        .hero h1 {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 22px;
            color: #cbd5e1;
        }

        section {
            padding: 100px 20px;
            max-width: 1100px;
            margin: auto;
        }

        h2 {
            font-size: 36px;
            margin-bottom: 30px;
            color: #38bdf8;
        }

        .about {
            line-height: 1.8;
            font-size: 18px;
        }

        .projects {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .card {
            background: #1e293b;
            border-radius: 15px;
            overflow: hidden;
            transition: transform 0.3s;
        }

        .card:hover {
            transform: translateY(-8px);
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .card-content {
            padding: 20px;
        }

        .card h3 {
            margin-bottom: 10px;
            color: #38bdf8;
        }

        footer {
            text-align: center;
            padding: 30px;
            background: #020617;
            color: #94a3b8;
        }

        @media (max-width: 800px) {
            .hero h1 {
                font-size: 40px;
            }

            .projects {
                grid-template-columns: 1fr;
            }

            nav a {
                margin: 0 8px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <a href="#home">Главная</a>
        <a href="#about">Обо мне</a>
        <a href="#projects">Проекты</a>
    </nav>

    <section class="hero" id="home">
        <div>
            <h1>Мой сайт</h1>
            <p>Добро пожаловать на мою страницу!</p>
        </div>
    </section>

    <section id="about">
        <h2>Обо мне</h2>
        <div class="about">
            <p>
                Привет! Это мой личный сайт.
                Здесь я рассказываю о себе и показываю свои проекты.
            </p>
        </div>
    </section>

    <section id="projects">
        <h2>Мои проекты</h2>

        <div class="projects">

            <div class="card">
                <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=800&q=80">
                <div class="card-content">
                    <h3>Проект 1</h3>
                    <p>Мой первый проект на HTML и CSS.</p>
                </div>
            </div>

            <div class="card">
